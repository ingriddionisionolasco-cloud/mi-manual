
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual de prácticas</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #17152e, #482c70, #151020);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    overflow: hidden;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

header h1 {
    color: #eadbff;
    font-size: 30px;
    text-shadow: 0 0 15px #b87aff;
}

header p {
    color: #d5c5f0;
    margin-top: 8px;
}

.libro {
    width: 850px;
    height: 540px;
    max-width: 95vw;
    display: flex;
    position: relative;
    perspective: 1800px;
    box-shadow: 0 20px 50px #0009;
    border-radius: 12px;
}

.lado {
    width: 50%;
    height: 100%;
    position: relative;
    background: #fffaff;
    color: #29213a;
    overflow: hidden;
}

.izquierda {
    border-radius: 12px 0 0 12px;
    border-right: 2px solid #d4c1e7;
}

.derecha {
    border-radius: 0 12px 12px 0;
}

.contenido {
    height: 100%;
    width: 100%;
    padding: 30px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
}

.contenido h2 {
    color: #713da9;
    font-size: 25px;
    margin-bottom: 15px;
    border-bottom: 2px solid #c8a5ed;
    padding-bottom: 10px;
}

.contenido p {
    font-size: 15px;
    line-height: 1.7;
    text-align: justify;
    margin-bottom: 12px;
}

.contenido img {
    width: 100%;
    max-height: 290px;
    object-fit: contain;
    margin: 15px auto;
    border-radius: 12px;
    box-shadow: 0 5px 15px #0002;
}

.numero {
    position: absolute;
    bottom: 12px;
    width: 100%;
    left: 0;
    text-align: center;
    color: #967bb7;
    font-size: 13px;
}

.portada {
    height: 100%;
    width: 100%;
    background: linear-gradient(145deg, #32165a, #7845b8, #251044);
    border: 3px solid #c9a8ff;
    color: white;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.portada h1 {
    color: white;
    font-size: 35px;
    line-height: 1.4;
    text-align: center;
    border: none;
    text-shadow: 0 0 15px #e4c5ff;
}

.portada p {
    text-align: center;
    color: #f0e4ff;
    margin-top: 12px;
}

.linea {
    width: 80%;
    height: 2px;
    background: #d8baff;
    margin: 25px auto;
}

.decoracion {
    font-size: 65px;
    margin-bottom: 20px;
}

.vacia {
    background: #f1eafa;
}

.animar {
    animation: pasar 0.55s ease;
}

@keyframes pasar {
    0% { transform: rotateY(0deg); }
    50% { transform: rotateY(-9deg); }
    100% { transform: rotateY(0deg); }
}

.zona {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    z-index: 10;
}

.zona-izquierda {
    left: 0;
    cursor: w-resize;
}

.zona-derecha {
    right: 0;
    cursor: e-resize;
}

.instruccion {
    text-align: center;
    margin-top: 25px;
    color: #e1d2f7;
    font-size: 14px;
}

.progreso {
    margin-top: 10px;
    color: #c8a5ed;
    font-size: 13px;
}

@media(max-width: 600px) {
    .libro {
        width: 96vw;
        height: 430px;
    }

    .contenido {
        padding: 15px;
    }

    .contenido h2 {
        font-size: 18px;
    }

    .contenido p {
        font-size: 12px;
    }

    .contenido img {
        max-height: 220px;
    }

    .portada h1 {
        font-size: 22px;
    }

    header h1 {
        font-size: 23px;
    }

    .decoracion {
        font-size: 40px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📖 Manual de prácticas</h1>
    <p>Libro digital interactivo</p>
</header>

<div class="libro" id="libro">

    <div class="lado izquierda" id="izquierda"></div>
    <div class="lado derecha" id="derecha"></div>

    <div class="zona zona-izquierda" id="zonaIzquierda"></div>
    <div class="zona zona-derecha" id="zonaDerecha"></div>

</div>

<div class="instruccion">
    ✨ Haz clic a la derecha para avanzar y a la izquierda para regresar.
</div>

<div class="progreso" id="progreso"></div>

<script>

/* =================================

const paginas = [

<p>2026</p>
`,

},

{

<p>El presente manual de prácticas reúne diferentes actividades realizadas durante el curso.</p>
<p>Su propósito es mostrar los trabajos desarrollados, explicar sus características y presentar evidencias de cada actividad mediante imágenes.</p>
<p>Estas prácticas permiten reforzar los conocimientos adquiridos en clase y desarrollar habilidades tecnológicas.</p>

`,
imagen: "imagenes/traductor.png"

/* =================================
   CONFIGURACIÓN DEL LIBRO
================================= */

let apertura = 0;

const izquierda = document.getElementById("izquierda");
const derecha = document.getElementById("derecha");

const totalAperturas = 10;

/* CREAR CONTENIDO */

function crearContenido(pagina, numero) {

    if (!pagina) {
        return `<div class="contenido vacia"></div>`;
    }

    return `
        <div class="contenido ${pagina.portada ? "portada" : ""}">

            ${pagina.portada ? "" : `<h2>${pagina.titulo}</h2>`}

            ${pagina.texto}

            ${pagina.imagen ? `
                <img src="${pagina.imagen}"
                     alt="${pagina.titulo}"
                     onerror="this.style.display='none';">
            ` : ""}

        </div>

        <div class="numero">${numero + 1} / 18</div>
    `;
}

/* MOSTRAR PÁGINAS */

function mostrarPagina() {

    let indiceIzquierda = apertura * 2 - 1;
    let indiceDerecha = apertura * 2;

    let paginaIzquierda = apertura === 0
        ? null
        : paginas[indiceIzquierda];

    let paginaDerecha = paginas[indiceDerecha] || null;

    izquierda.innerHTML = paginaIzquierda
        ? crearContenido(paginaIzquierda, indiceIzquierda)
        : `<div class="contenido vacia"></div>`;

    derecha.innerHTML = paginaDerecha
        ? crearContenido(paginaDerecha, indiceDerecha)
        : `<div class="contenido vacia"></div>`;

    izquierda.classList.remove("animar");
    derecha.classList.remove("animar");

    void izquierda.offsetWidth;

    izquierda.classList.add("animar");
    derecha.classList.add("animar");

    let inicio = apertura === 0 ? 1 : apertura * 2;
    let fin = Math.min(inicio + 1, 18);

    document.getElementById("progreso").textContent =
        apertura === 0
        ? "Portada | 18 páginas"
        : `Páginas ${inicio} y ${fin} de 18`;
}

/* AVANZAR */

document.getElementById("zonaDerecha")
.addEventListener("click", function() {

    if (apertura < totalAperturas - 1) {
        apertura++;
        mostrarPagina();
    }

});

/* REGRESAR */

document.getElementById("zonaIzquierda")
.addEventListener("click", function() {

    if (apertura > 0) {
        apertura--;
        mostrarPagina();
    }

});

/* INICIAR */

mostrarPagina();

</script>

</html>
